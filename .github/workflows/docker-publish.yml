name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "k3s/**"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: lkh-portfolio
  IMAGE_REPO: ghcr.io/lkh599810/lkh-portfolio

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Update Kubernetes manifest image tag
        run: |
          sed -i "s|image: ghcr.io/lkh599810/lkh-portfolio:.*|image: ghcr.io/lkh599810/lkh-portfolio:${{ github.sha }}|g" k3s/portfolio.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k3s/portfolio.yaml
          git commit -m "Update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push